<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Let the unprivileged "autopost" service user talk to BlueZ, so autopost-ble-setup.py can register its GATT
  application and its LE advertisement without running as root.

  This mirrors the pattern 50-autopost-nm.rules already uses for NetworkManager: the service stays unprivileged
  and locked down, and it is granted exactly one daemon, by name, rather than being handed root because one API
  needed a capability.

  BlueZ's own /etc/dbus-1/system.d/bluetooth.conf grants the `bluetooth` GROUP access, and the service unit does
  put autopost in that group - but which distro releases ship that group stanza has changed more than once, and
  a rescue channel that silently stops registering after an OS bump is worthless. Naming the user outright makes
  it independent of that. Installed to /etc/dbus-1/system.d/ by deploy/pi/install.sh.

  Scope note: send_destination="org.bluez" is the whole of the grant. It does not confer ownership of the name
  (only bluetoothd itself owns org.bluez), so this cannot be used to impersonate the Bluetooth daemon.
-->
<busconfig>
  <policy user="autopost">
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.GattManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.LEAdvertisingManager1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1"/>
  </policy>
</busconfig>
