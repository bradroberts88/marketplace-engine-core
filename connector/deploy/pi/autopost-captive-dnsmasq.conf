# AutoPost captive-portal DNS — installed to /etc/NetworkManager/dnsmasq-shared.d/ by install.sh.
# When the WiFi-recovery service raises the "AutoPost-Setup" access point (NetworkManager ipv4.method=shared,
# which launches a dnsmasq instance on 10.42.0.1), this makes that dnsmasq answer EVERY DNS query with the
# portal's IP. So every phone/OS captive-portal probe (captive.apple.com, connectivitycheck.gstatic.com,
# www.msftconnecttest.com, ...) resolves to the portal and the "Sign in to network" sheet pops automatically.
# Static file -> safe on the future read-only golden image (we only ever read it).
address=/#/10.42.0.1
